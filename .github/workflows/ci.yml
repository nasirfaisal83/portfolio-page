name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
  NODE_ENV: production

jobs:
  # ── 1. Lint + type-check ─────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run type-check

  # ── 2. Unit tests ────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # ── 3. Production build + content check + bundle size ───────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    outputs:
      # Pass build artefact path to downstream jobs
      out_path: out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # prebuild runs content-check.ts + og.ts
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
      # Upload static export for downstream jobs
      - uses: actions/upload-artifact@v4
        with:
          name: next-out
          path: out
          retention-days: 1
      # Bundle-size check
      - run: npx bundlesize
        continue-on-error: true

  # ── 4. End-to-end tests (Playwright) ────────────────────────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-out
          path: out
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Serve static export and run Playwright
        run: |
          npx serve -s out -l 3000 &
          sleep 3
          TEST_BASE_URL=http://localhost:3000 npm run test:e2e

  # ── 5. SEO tests ────────────────────────────────────────────────────────
  seo:
    name: SEO tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-out
          path: out
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Serve static export and run SEO tests
        run: |
          npx serve -s out -l 3000 &
          sleep 3
          TEST_BASE_URL=http://localhost:3000 \
          NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }} \
          npx playwright test tests/seo/

  # ── 6. Lighthouse CI ─────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-out
          path: out
      - name: Run Lighthouse CI
        run: |
          npx serve -s out -l 3000 &
          sleep 3
          npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
